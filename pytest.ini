[pytest]
# Indiquer où chercher les tests
testpaths = synesthesia/_tests
python_files = test_*.py

filterwarnings =
	# Pydantic Warnings
	ignore::pydantic.warnings.PydanticDeprecatedSince20
	# CI Warnings
	ignore:.*Failed to disconnect.*
	ignore:.*OpenGL version could not be determined.*
	ignore:.*could not determine DPI.*

# Définir des options de ligne de commande par défaut
addopts = -s -v --color=yes
          --cov=synesthesia --cov-report=xml:reports/coverage.xml
          --cov-config=.coveragerc
          --json-report --json-report-file=reports/test_report.json
          --capture=tee-sys
